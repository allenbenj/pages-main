  - region [ref=e100]:
    - generic [ref=e102]:
      - heading "Seven Factors" [level=2] [ref=e103]
      - paragraph [ref=e105]: State v. Allen presents seven factors that are recognizable patterns in the wrongful-conviction research literature. This case is not a unique outlier and not a borderline evidentiary dispute.
      - list [ref=e106]:
        - listitem [ref=e107]: • Complainant with institutional access to law enforcement
        - listitem [ref=e108]: • Investigator with a personal relationship to the complainant's circle
        - listitem [ref=e109]: • Suppression or re-framing of exculpatory material at the investigation stage
        - listitem [ref=e110]: • Prosecutorial charging decision treating investigative momentum as a substitute for independent evidence review
        - listitem [ref=e111]: • Video evidence contradicting the narrative
        - listitem [ref=e112]: • Physical impossibility in the complainant's narrative
        - listitem [ref=e113]: • Uninvestigated financial motive
      - paragraph [ref=e114]: The information on this website provides the population-level context for understanding why a case with this profile exists and how it survives. It does not require special cynicism or conspiracy thinking. It requires only that the documented facts be held against the documented research, and the result observed.

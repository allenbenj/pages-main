  - region [ref=e18]:
    - generic [ref=e20]:
      - paragraph [ref=e21]: Compare the Record
      - heading "How Long Can the Justice System disrupt the life of an Innocent Man?" [level=2] [ref=e22]
      - generic [ref=e23]: Two men, one Georgia jail, and more than a decade without a conviction.
      - article [ref=e24]:
        - heading "The Maurice Jimmerson Case (10 Years, 10 Months)" [level=3] [ref=e25]:
          - text: The Maurice Jimmerson Case
          - generic [ref=e26]: (10 Years, 10 Months)
        - generic [ref=e27]:
          - generic [ref=e28]:
            - term [ref=e29]: The Arrest
            - definition [ref=e30]: Maurice Jimmerson was arrested in Dougherty County, Georgia, in May 2013 on murder charges.
          - generic [ref=e31]:
            - term [ref=e32]: The Stagnation
            - definition [ref=e33]: He was held continuously in a local jail awaiting his day in court. His case was delayed for nearly eleven years due to systemic bureaucratic failures, a courthouse flood, the COVID-19 pandemic, and an eight-month stretch where the court completely forgot to assign him an attorney.
          - generic [ref=e34]:
            - term [ref=e35]: The Zero-Conviction Conclusion
            - definition [ref=e36]: He finally went to trial in July 2023, which resulted in a mistrial (hung jury) rather than a conviction. Because he had spent over a decade locked up as a legally innocent man, his defense attorney successfully argued that a retrial would heavily violate his Sixth Amendment rights. To secure his immediate release without a conviction on his record, he accepted a non-custodial probation plea deal for lesser charges and was released in March 2024.
      - article [ref=e37]:
        - heading "Longest Awaiting Trial to an Acquittal Condell Benyard (8 Years)" [level=3] [ref=e38]:
          - text: Longest Awaiting Trial to an Acquittal
          - generic [ref=e39]: Condell Benyard (8 Years)
        - paragraph [ref=e40]: If you require the trial process to end specifically in a not-guilty verdict (acquittal) rather than a hung jury or a plea deal, the record belongs to Jimmerson's co-defendant, Condell Benyard.
        - generic [ref=e41]:
          - generic [ref=e42]:
            - term [ref=e43]: The Timeline
            - definition [ref=e44]: Benyard was arrested alongside Jimmerson in May 2013.
          - generic [ref=e45]:
            - term [ref=e46]: The Outcome
            - definition [ref=e47]: He remained locked in the exact same Georgia jail without a conviction until his case finally went to a jury in July 2023. The jury found him not guilty on all counts, ending his 8-year pretrial detention with a total, unblemished acquittal.
      - paragraph [ref=e48]: Lee County, North Carolina, may soon strip this Georgia jail of its infamous title. The Allen case, with its growing record of alleged corruption, collusion, conspiracy, and cronyism, is rapidly becoming a case study in institutional failure.
  - region "Corruption of Justice" [ref=e49]:
    - generic [ref=e50]:
      - img "Corruption of Justice — click to view full size" [ref=e51]
      - blockquote "Quote by Justice Sonia Sotomayor" [ref=e52]:
        - generic:
          - generic: "\"We must not pretend that the countless people who are routinely targeted by police are isolated. They are the canaries in the coal mine whose deaths, civil and literal, warn us that no one can breathe in this atmosphere… Until their voices matter too, our justice system will continue to be anything but.\""
          - generic: — Justice Sonia Sotomayor, Dissenting Opinion in Utah v. Strieff (2016)
      - blockquote "Quote by Justice Harry Blackmun" [ref=e53]:
        - generic:
          - generic: "\"The requirement that a warrant not issue 'but upon probable cause, supported by Oath or affirmation,' would be reduced to a nullity if a police officer was able to use deliberately falsified allegations to demonstrate probable cause, and, having misled the magistrate, then was able to remain confident that the ploy was worthwhile.\""
          - generic: — Justice Harry Blackmun, Majority Opinion in Franks v. Delaware (1978)
      - blockquote "Quote by Judge Bruce Selya" [ref=e54]:
        - generic:
          - generic: "\"If any concept is fundamental to our American system of justice, it is that those charged with upholding the law are prohibited from deliberately fabricating evidence and framing individuals for crimes they did not commit… Actions taken in contravention of this prohibition necessarily violate due process.\""
          - generic: — Judge Bruce Selya, Limone v. Condon (1st Cir. 2004)
      - blockquote "Quote by Justice Louis D. Brandeis" [ref=e55]:
        - generic:
          - generic: "\"Crime is contagious. If the Government becomes a lawbreaker, it breeds contempt for law; it invites every man to become a law unto himself; it invites anarchy. To declare that in the administration of the criminal law the end justifies the means—to declare that the Government may commit crimes in order to secure the conviction of a private criminal—would bring terrible retribution.\""
          - generic: — Justice Louis D. Brandeis, Dissenting Opinion in Olmstead v. United States (1928)
      - blockquote "Quote by Charles de Montesquieu" [ref=e56]:
        - generic:
          - generic: "\"There is no crueler tyranny than that which is perpetuated under the shield of law and in the name of justice.\""
          - generic: — Charles de Montesquieu, The Spirit of the Laws (1748)
      - blockquote "Quote by Justice William Brennan" [ref=e57]:
        - generic:
          - generic: "\"The true danger inherent in this type of police misconduct is that it subverts the factfinding process itself… The system's ability to objectively evaluate the evidence is fatally compromised when those charged with gathering it actively manipulate the outcome.\""
          - generic: — Justice William Brennan, Dissenting in Colorado v. Connelly (1986)
      - blockquote "Quote by Justice Tom C. Clark" [ref=e58]:
        - generic:
          - generic: "\"The ignoble shortcut to conviction left open to the State tends to destroy the entire system of constitutional restraints on which the liberties of the people rest… Nothing can destroy a government more quickly than its failure to observe its own laws, or worse, its disregard of the charter of its own existence.\""
          - generic: — Justice Tom C. Clark, Majority Opinion in Mapp v. Ohio (1961)
      - blockquote "Quote by Justice Robert H. Jackson" [ref=e59]:
        - generic:
          - generic: "\"The prosecutor has more control over life, liberty, and reputation than any other person in America. His discretion is tremendous… While the prosecutor at his best is one of the most beneficent forces in our society, when he acts from malice or other base motives, he is one of the worst.\""
          - generic: — Justice Robert H. Jackson, The Federal Prosecutor (1940)
      - blockquote "Quote by Justice George Sutherland" [ref=e60]:
        - generic:
          - generic: "\"The United States Attorney is the representative not of an ordinary party to a controversy, but of a sovereignty whose obligation to govern impartially is as compelling as its obligation to govern at all; and whose interest, therefore, in a criminal prosecution is not that it shall win a case, but that justice shall be done… It is as much his duty to refrain from improper methods calculated to produce a wrongful conviction as it is to use every legitimate means to bring about a just one.\""
          - generic: — Justice George Sutherland, Majority Opinion in Berger v. United States (1935)
      - blockquote "Quote by Chief Justice Earl Warren" [ref=e61]:
        - generic:
          - generic: "\"The principle that a State may not knowingly use false evidence, including false testimony, to obtain a tainted conviction, implicit in any concept of ordered liberty, does not cease to apply merely because the false testimony goes only to the credibility of the witness. The jury's estimate of the truthfulness and reliability of a given witness may well be determinative of guilt or innocence, and it is upon such subtle factors as the possible interest of the witness in testifying falsely that a defendant's life or liberty may depend.\""
          - generic: — Chief Justice Earl Warren, Majority Opinion in Napue v. Illinois (1959)
